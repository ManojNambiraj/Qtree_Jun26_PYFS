<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form>
      <header>
        <h3>User Registration</h3>
      </header>

      <div>
        <label for="username">Username</label>
        <input type="text" id="username" required />
      </div>

      <div>
        <label for="age">Age</label>
        <input type="number" id="age" />
      </div>

      <div>
        <label for="mobile">Mobile</label>
        <input type="number" id="mobile" />
      </div>

      <div>
        <label for="email">Email</label>
        <input type="email" id="email" />
      </div>

      <div>
        <label for="password">Password</label>
        <input type="password" id="password" />
      </div>

      <div>
        <label for="Gender">Gender</label><br />

        <input type="radio" id="Male" name="Gender" /><label for="Male"
          >Male</label
        >
        <input type="radio" id="Female" name="Gender" /><label for="Female"
          >Female</label
        >
      </div>

      <div>
        <label for="FavColor">FavColor</label><br />

        <input type="checkbox" id="Blue" /><label for="Blue">Blue</label><br />
        <input type="checkbox" id="Yellow" /><label for="Yellow">Yellow</label
        ><br />
        <input type="checkbox" id="Red" /><label for="Red">Red</label><br />
        <input type="checkbox" id="Pink" /><label for="Pink">Pink</label><br />
        <input type="checkbox" id="Green" /><label for="Green">Green</label
        ><br />
      </div>

      <div>
        <label for="Your_Car">Your_Car</label>

        <select name="Your_Car" id="Your_Car">
          <option value="" selected disabled>--Select--</option>
          <option value="BMW">BMW</option>
          <option value="Volvo">Volvo</option>
          <option value="Ferrari">Ferrari</option>
          <option value="Hyundai">Hyundai</option>
          <option value="Audi">Audi</option>
        </select>
      </div>

      <div>
        <label for="Upload_Resume">Upload_Resume</label>

        <input type="file" />
      </div>

      <div>
        <label for="DOB">DOB</label>

        <input type="date" />
      </div>

      <div>
        <label for="TOB">TOB</label>

        <input type="time" />
      </div>

      <div>
        <label for="Message">Message</label><br />

        <textarea name="Message" id="Message" rows="5" cols="50"></textarea>
      </div>

      <div>
        <button>Cancel</button>
        <input type="button" value="Reset" />
        <input type="submit" />
      </div>
    </form>
  </body>
</html>
