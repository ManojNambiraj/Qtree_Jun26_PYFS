<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        .box{
            width: 150px;
            height: 150px;
            background-color: blue;
            transition: 2s;
        }

        .box:hover{
            width: 100px;
            height: 100px;
            background-color: red;
            transition: 2s;
            border-radius: 50%;
            transform: rotate(45deg);
            margin-left: 300px;
        }
    </style>
  </head>
  <body>
    <h1>Third Page</h1>

    <p>
      Lorem ipsum, dolor sit amet consectetur adipisicing elit. Praesentium
      accusamus hic consequuntur natus delectus
    </p>

    <div class="box"></div>
  </body>
</html>
